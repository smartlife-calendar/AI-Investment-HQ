<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>StockIQ 台股</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b;word-break:keep-all}
a{color:#1e40af}
</style>
</head>
<body>
<div style="background:linear-gradient(135deg,#1e40af,#7c3aed);color:#fff;padding:14px 16px">
<div style="font-size:18px;font-weight:800">🇹🇼 StockIQ 台股</div>
<div style="font-size:11px;opacity:.8">TWSE+TPEx · <span id="ut">載入中</span> · <a href="/" style="color:rgba(255,255,255,.7)">美股版→</a></div>
</div>

<div id="tabs" style="display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px;background:#fff;border-bottom:1px solid #e2e8f0"></div>

<div id="main" style="max-width:1200px;margin:0 auto;padding:8px"></div>

<div style="text-align:center;font-size:10px;color:#94a3b8;padding:12px">
StockIQ 台股 · 資料: 證交所/櫃買中心/Yahoo Finance · ⚠️ 僅供參考
</div>

<script>
var D=null, CT='overview';
var TABS=[
  {id:'overview',label:'📊 總覽'},
  {id:'signals',label:'📡 訊號'},
  {id:'institutional',label:'🏦 法人'},
  {id:'industry',label:'🏭 產業'},
  {id:'accumulation',label:'💡 吸籌'},
  {id:'news',label:'📰 新聞'},
  {id:'crossmarket',label:'🔗 聯動'},
  {id:'search',label:'🔍 搜尋'}
];

function initTabs(){
  var c=document.getElementById('tabs');
  TABS.forEach(function(t){
    var b=document.createElement('div');
    b.id='tab-'+t.id;
    b.textContent=t.label;
    b.style.cssText='padding:6px 12px;border-radius:16px;border:1px solid #e2e8f0;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;flex-shrink:0;background:white;color:#64748b;-webkit-tap-highlight-color:transparent';
    if(t.id===CT){b.style.background='#1e40af';b.style.color='#fff';b.style.border='none'}
    b.addEventListener('click',function(){switchTab(t.id)});
    c.appendChild(b);
  });
}

function switchTab(id){
  CT=id;
  TABS.forEach(function(t){
    var b=document.getElementById('tab-'+t.id);
    if(!b)return;
    if(t.id===id){b.style.background='#1e40af';b.style.color='#fff';b.style.border='none'}
    else{b.style.background='white';b.style.color='#64748b';b.style.border='1px solid #e2e8f0'}
  });
  render();
}

function render(){
  var m=document.getElementById('main');
  if(!D){m.innerHTML='<p style="text-align:center;color:#94a3b8;padding:40px">⏳ 載入中...</p>';return}
  switch(CT){
    case 'overview': m.innerHTML=rOverview(); break;
    case 'signals': m.innerHTML=rSignals(); break;
    case 'institutional': m.innerHTML=rInst(); break;
    case 'industry': m.innerHTML=rIndustry(); break;
    case 'accumulation': m.innerHTML=rAccum(); break;
    case 'news': m.innerHTML=rNews(); break;
    case 'crossmarket': m.innerHTML=rCross(); break;
    case 'search': m.innerHTML=rSearch(); break;
  }
}

function card(h){return '<div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)">'+h+'</div>'}

function rOverview(){
  var s=D.summary||{},o='';
  // Stats grid - use explicit inline grid
  o+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">';
  var stats=[
    {n:s.buy||0,l:'🟢 買入',c:'#16a34a'},
    {n:s.watch||0,l:'👀 觀望',c:'#7c3aed'},
    {n:D.total_stocks,l:'總追蹤',c:'#1e293b'},
    {n:(s.by_action||{}).REDUCE||0,l:'🟠 減碼',c:'#f59e0b'},
    {n:s.avoid||0,l:'⛔ 迴避',c:'#dc2626'},
    {n:(s.by_action||{}).NEUTRAL||0,l:'⚪ 中性',c:'#64748b'}
  ];
  stats.forEach(function(st){
    o+='<div style="background:#f8fafc;padding:8px 4px;border-radius:8px;text-align:center">';
    o+='<div style="font-size:20px;font-weight:800;color:'+st.c+'">'+st.n+'</div>';
    o+='<div style="font-size:10px;color:#64748b">'+st.l+'</div></div>';
  });
  o+='</div>';

  // Top BUY signals - compact table
  var buys=(D.signals||[]).filter(function(x){return x.action==='BUY'}).slice(0,10);
  if(buys.length){
    o+=card('<div style="font-size:14px;font-weight:700;margin-bottom:6px">🟢 買入 Top 10</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<tr style="background:#f1f5f9"><th style="padding:4px;text-align:left">代號</th><th>名稱</th><th>價格</th><th>進場</th><th>止損</th><th>目標</th><th>RR</th></tr>'+
    buys.map(function(s){
      var pl=s.price_levels||{};
      return '<tr style="border-bottom:1px solid #f1f5f9">'+
        '<td style="padding:4px;font-weight:700">'+s.code+'</td>'+
        '<td style="padding:4px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.name.substring(0,4)+'</td>'+
        '<td style="padding:4px">$'+(s.price||0).toLocaleString()+'</td>'+
        '<td style="padding:4px;color:#1e40af;font-weight:700">'+(pl.entry?'$'+pl.entry:'-')+'</td>'+
        '<td style="padding:4px;color:#dc2626;font-size:10px">'+(pl.stop_loss?'$'+pl.stop_loss:'-')+'</td>'+
        '<td style="padding:4px;color:#16a34a;font-size:10px">'+(pl.target1?'$'+pl.target1:'-')+'</td>'+
        '<td style="padding:4px;font-weight:700">'+(pl.rr_ratio?pl.rr_ratio.toFixed(1):'-')+'</td></tr>'
    }).join('')+'</table></div>');
  }

  // Foreign top buy/sell - compact
  var fb=D.foreign_top_buy||[];
  if(fb.length){
    o+=card('<div style="font-size:14px;font-weight:700;margin-bottom:6px">🏦 外資買超 Top 10</div>'+
    fb.slice(0,10).map(function(s){
      return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f8fafc;font-size:12px">'+
        '<span><b>'+s.code+'</b> '+s.name.substring(0,4)+' $'+s.price+'</span>'+
        '<span style="color:#dc2626;font-weight:700">+'+(s.net/1000).toFixed(0)+'K</span></div>'
    }).join(''));
  }

  return o;
}

function rSignals(){
  var sigs=D.signals||[],o='';
  var groups=[
    {k:'BUY',l:'🟢 買入',c:'#16a34a',open:true},
    {k:'WATCH',l:'👀 觀望',c:'#7c3aed',open:true},
    {k:'NEUTRAL',l:'⚪ 中性',c:'#64748b',open:false},
    {k:'REDUCE',l:'🟠 減碼',c:'#f59e0b',open:false},
    {k:'AVOID',l:'⛔ 迴避',c:'#dc2626',open:false}
  ];
  groups.forEach(function(g){
    var items=sigs.filter(function(s){return s.action===g.k});
    if(!items.length)return;
    var tbl='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
      '<tr style="background:#f1f5f9"><th style="padding:3px;text-align:left">代號</th><th>名稱</th><th>產業</th><th>價格</th><th>分數</th><th>原因</th></tr>'+
      items.slice(0,30).map(function(s){
        var sc=s.score>0?'#16a34a':s.score<0?'#dc2626':'#64748b';
        return '<tr style="border-bottom:1px solid #f1f5f9">'+
          '<td style="padding:3px;font-weight:700">'+s.code+'</td>'+
          '<td style="padding:3px;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.name.substring(0,4)+'</td>'+
          '<td style="padding:3px;font-size:10px;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.industry||'')+'</td>'+
          '<td style="padding:3px">$'+(s.price||0).toLocaleString()+'</td>'+
          '<td style="padding:3px;font-weight:700;color:'+sc+'">'+(s.score>0?'+':'')+s.score+'</td>'+
          '<td style="padding:3px;font-size:10px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.reasons||[]).slice(0,2).join(', ')+'</td></tr>'
      }).join('');
    if(items.length>30) tbl+='<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:4px">...還有'+(items.length-30)+'支</td></tr>';
    tbl+='</table></div>';
    if(g.open){
      o+=card('<div style="font-size:14px;font-weight:700;color:'+g.c+';margin-bottom:4px">'+g.l+' ('+items.length+')</div>'+tbl);
    } else {
      o+='<details style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)"><summary style="cursor:pointer;font-size:14px;font-weight:700;color:'+g.c+'">'+g.l+' ('+items.length+')</summary>'+tbl+'</details>';
    }
  });
  return o;
}

function rInst(){
  var sigs=D.signals||[],o='';
  var byF=sigs.filter(function(s){return s.institutional&&s.institutional.foreign_net!==0})
    .sort(function(a,b){return(b.institutional.foreign_net||0)-(a.institutional.foreign_net||0)});
  function instTable(items,label,color){
    return card('<div style="font-size:14px;font-weight:700;color:'+color+';margin-bottom:4px">'+label+'</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<tr style="background:#f1f5f9"><th style="padding:3px;text-align:left">代號</th><th>名稱</th><th>產業</th><th>外資</th><th>投信</th><th>訊號</th></tr>'+
    items.map(function(s){
      var fi=s.institutional||{};
      return '<tr style="border-bottom:1px solid #f1f5f9">'+
        '<td style="padding:3px;font-weight:700">'+s.code+'</td>'+
        '<td style="padding:3px;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.name.substring(0,4)+'</td>'+
        '<td style="padding:3px;font-size:10px">'+(s.industry||'').substring(0,4)+'</td>'+
        '<td style="padding:3px;color:'+(fi.foreign_net>0?'#dc2626':'#16a34a')+';font-weight:700">'+(fi.foreign_net>0?'+':'')+(fi.foreign_net/1000).toFixed(0)+'K</td>'+
        '<td style="padding:3px;color:'+(fi.trust_net>0?'#dc2626':'#16a34a')+'">'+(fi.trust_net>0?'+':'')+(fi.trust_net/1000).toFixed(0)+'K</td>'+
        '<td style="padding:3px;font-size:10px">'+s.action_zh+'</td></tr>'
    }).join('')+'</table></div>');
  }
  o+=instTable(byF.slice(0,20),'🔴 外資買超 Top 20','#dc2626');
  o+=instTable(byF.slice(-20).reverse(),'🟢 外資賣超 Top 20','#16a34a');
  return o;
}

function rIndustry(){
  var stats=D.industry_stats||{},o='';
  o+=card('<div style="font-size:14px;font-weight:700;margin-bottom:4px">🏭 產業評分</div>'+
  '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
  '<tr style="background:#f1f5f9"><th style="padding:3px;text-align:left">產業</th><th>家數</th><th>買入</th><th>平均</th></tr>'+
  Object.keys(stats).map(function(k){
    var s=stats[k];
    var c=s.avg_score>0?'#16a34a':s.avg_score<-1?'#dc2626':'#64748b';
    return '<tr style="border-bottom:1px solid #f1f5f9">'+
      '<td style="padding:3px;font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+k+'</td>'+
      '<td style="padding:3px">'+s.count+'</td>'+
      '<td style="padding:3px;color:#16a34a;font-weight:700">'+s.buy+'</td>'+
      '<td style="padding:3px;color:'+c+';font-weight:700">'+(s.avg_score>0?'+':'')+s.avg_score+'</td></tr>'
  }).join('')+'</table></div>');
  return o;
}

function rAccum(){
  if(!D.accumulation)return card('<p style="color:#94a3b8;text-align:center">無吸籌資料</p>');
  var o='',acc=D.accumulation;
  function accTable(items,label,color){
    return card('<div style="font-size:14px;font-weight:700;color:'+color+';margin-bottom:4px">'+label+' ('+items.length+')</div>'+
    '<div style="font-size:10px;color:#64748b;margin-bottom:6px">外資投信同買+法人佔成交>10%</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<tr style="background:#f1f5f9"><th style="padding:3px;text-align:left">代號</th><th>名稱</th><th>價格</th><th>漲跌</th><th>法人%</th><th>原因</th></tr>'+
    items.slice(0,30).map(function(s){
      return '<tr style="border-bottom:1px solid #f1f5f9">'+
        '<td style="padding:3px;font-weight:700">'+s.code+'</td>'+
        '<td style="padding:3px;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.name||'').substring(0,4)+'</td>'+
        '<td style="padding:3px">$'+(s.price||0).toLocaleString()+'</td>'+
        '<td style="padding:3px;color:'+(s.change_pct>0?'#dc2626':'#16a34a')+'">'+(s.change_pct>0?'+':'')+s.change_pct+'%</td>'+
        '<td style="padding:3px;font-weight:700;color:#dc2626">'+(s.flow_ratio||0)+'%</td>'+
        '<td style="padding:3px;font-size:10px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.reasons||[]).slice(0,2).join(', ')+'</td></tr>'
    }).join('')+'</table></div>');
  }
  o+=accTable(acc.bullish||[],'🟢 吸籌偵測','#16a34a');
  o+='<details style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)"><summary style="cursor:pointer;font-size:14px;font-weight:700;color:#dc2626">🔴 出貨偵測 ('+(acc.bearish||[]).length+')</summary>';
  if((acc.bearish||[]).length){
    o+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<tr style="background:#f1f5f9"><th style="padding:3px;text-align:left">代號</th><th>名稱</th><th>價格</th><th>漲跌</th><th>法人%</th></tr>'+
    (acc.bearish||[]).slice(0,30).map(function(s){
      return '<tr style="border-bottom:1px solid #f1f5f9">'+
        '<td style="padding:3px;font-weight:700">'+s.code+'</td>'+
        '<td style="padding:3px">'+(s.name||'').substring(0,4)+'</td>'+
        '<td style="padding:3px">$'+(s.price||0).toLocaleString()+'</td>'+
        '<td style="padding:3px;color:#16a34a">'+s.change_pct+'%</td>'+
        '<td style="padding:3px;color:#16a34a;font-weight:700">'+(s.flow_ratio||0)+'%</td></tr>'
    }).join('')+'</table></div>';
  }
  o+='</details>';
  return o;
}

function rNews(){
  if(!D.news)return card('<p style="color:#94a3b8;text-align:center">無新聞</p>');
  var cats=D.news.categories||{},o='';
  var order=[
    {k:'法人動向',icon:'🏦',c:'#7c3aed'},
    {k:'個股焦點',icon:'🔍',c:'#1e40af'},
    {k:'國際連動',icon:'🌍',c:'#059669'},
    {k:'市場動態',icon:'📊',c:'#dc2626'}
  ];
  order.forEach(function(cat){
    var items=cats[cat.k]||[];
    if(!items.length)return;
    o+=card('<div style="font-size:14px;font-weight:700;color:'+cat.c+';margin-bottom:4px">'+cat.icon+' '+cat.k+' ('+items.length+')</div>'+
    items.map(function(n){
      return '<div style="padding:4px 0;border-bottom:1px solid #f1f5f9">'+
        '<a href="'+(n.url||'#')+'" target="_blank" style="color:#1e293b;text-decoration:none;font-size:12px;font-weight:600">'+n.title+'</a>'+
        '<div style="font-size:10px;color:#94a3b8">'+(n.source||'')+'</div></div>'
    }).join(''));
  });
  return o||card('<p style="color:#94a3b8;text-align:center">暫無新聞</p>');
}

function rCross(){
  if(!D.cross_market)return card('<p style="color:#94a3b8;text-align:center">無聯動資料</p>');
  var cm=D.cross_market,o='';
  var us=cm.us_overnight||{};
  // US overnight
  o+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px">';
  var keys=Object.keys(us).sort(function(a,b){return Math.abs(us[b].change_pct)-Math.abs(us[a].change_pct)});
  keys.slice(0,9).forEach(function(sym){
    var d=us[sym];
    var bg=d.change_pct>3?'#fee2e2':d.change_pct>0?'#fef2f2':d.change_pct<-3?'#dcfce7':'#f0fdf4';
    var c=d.change_pct>0?'#dc2626':'#16a34a';
    o+='<div style="background:'+bg+';padding:6px;border-radius:8px;text-align:center">'+
      '<div style="font-weight:700;font-size:12px">'+sym+'</div>'+
      '<div style="font-size:14px;font-weight:800;color:'+c+'">'+(d.change_pct>0?'+':'')+d.change_pct.toFixed(1)+'%</div></div>';
  });
  o+='</div>';
  // Linkage
  var links=cm.linkage_signals||[];
  var bull=links.filter(function(l){return l.direction==='利多'});
  var bear=links.filter(function(l){return l.direction==='利空'});
  if(bull.length){
    o+=card('<div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:4px">📈 利多 ('+bull.length+')</div>'+
    bull.map(function(l){
      return '<div style="font-size:12px;padding:3px 0;border-bottom:1px solid #f1f5f9">'+
        '<b>'+l.us_stock+'</b> <span style="color:#dc2626">'+(l.us_change>0?'+':'')+l.us_change.toFixed(1)+'%</span> → '+
        '<b>'+l.tw_code+'</b> '+l.tw_name+' <span style="font-size:10px;color:#64748b">('+l.relation+')</span></div>'
    }).join(''));
  }
  if(bear.length){
    o+=card('<div style="font-size:14px;font-weight:700;color:#16a34a;margin-bottom:4px">📉 利空 ('+bear.length+')</div>'+
    bear.map(function(l){
      return '<div style="font-size:12px;padding:3px 0;border-bottom:1px solid #f1f5f9">'+
        '<b>'+l.us_stock+'</b> <span style="color:#16a34a">'+l.us_change.toFixed(1)+'%</span> → '+
        '<b>'+l.tw_code+'</b> '+l.tw_name+' <span style="font-size:10px;color:#64748b">('+l.relation+')</span></div>'
    }).join(''));
  }
  return o;
}

function rSearch(){
  return card('<input type="text" id="si" placeholder="輸入代號或名稱 (如 2330 台積電)" '+
    'style="width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none" '+
    'oninput="doSearch()"><div id="sr" style="margin-top:8px"></div>');
}

function doSearch(){
  if(!D)return;
  var q=document.getElementById('si').value.trim().toLowerCase();
  var el=document.getElementById('sr');
  if(!q||q.length<2){el.innerHTML='';return}
  var r=(D.signals||[]).filter(function(s){
    return s.code.toLowerCase().indexOf(q)>=0||(s.name||'').toLowerCase().indexOf(q)>=0
  }).slice(0,15);
  if(!r.length){el.innerHTML='<p style="color:#94a3b8">找不到</p>';return}
  el.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<tr style="background:#f1f5f9"><th style="padding:3px;text-align:left">代號</th><th>名稱</th><th>價格</th><th>訊號</th><th>分數</th></tr>'+
    r.map(function(s){
      var sc=s.score>0?'#16a34a':s.score<0?'#dc2626':'#64748b';
      return '<tr style="border-bottom:1px solid #f1f5f9">'+
        '<td style="padding:3px;font-weight:700">'+s.code+'</td>'+
        '<td style="padding:3px">'+s.name+'</td>'+
        '<td style="padding:3px">$'+(s.price||0).toLocaleString()+'</td>'+
        '<td style="padding:3px">'+s.action_zh+'</td>'+
        '<td style="padding:3px;font-weight:700;color:'+sc+'">'+(s.score>0?'+':'')+s.score+'</td></tr>'
    }).join('')+'</table>';
}

async function load(){
  try{
    var r=await fetch('/tw/data/tw_signals.json?t='+Date.now());
    D=await r.json();
    document.getElementById('ut').textContent=new Date(D.generated_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});
    render();
  }catch(e){
    document.getElementById('main').innerHTML='<p style="color:#dc2626;text-align:center;padding:40px">❌ '+e.message+'</p>';
  }
}
